# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      nuxt:
        patterns:
          - 'nuxt*'
          - '@nuxt/*'
      vue:
        patterns:
          - 'vue*'
          - '@vue/*'
